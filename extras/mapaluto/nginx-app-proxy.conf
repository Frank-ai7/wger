# nginx für app.mapaluto.de (Hetzner)
# Deploy: extras/mapaluto/DEPLOY-HETZNER.sh
#
# Lauscht auf 127.0.0.1:8081 — typisch hinter Cloudflare Tunnel.
# Root / liefert statische Startseite (behebt 502 nach Cloudflare-Login).
# /toms-mal-app/ und /festung/ proxen zu lokalen Diensten.

server {
    listen 127.0.0.1:8081;
    server_name app.mapaluto.de;

    root /var/www/app.mapaluto.de;
    index index.html;

    # Root — ohne diese Regel: 502 Bad Gateway
    location = / {
        try_files /index.html =404;
    }

    location /toms-mal-app/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /festung/ {
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
