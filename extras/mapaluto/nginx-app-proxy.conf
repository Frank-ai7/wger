# nginx-Proxy für app.mapaluto.de
# Auf Hetzner (195.201.129.16) einbinden, dann: sudo nginx -t && sudo systemctl reload nginx
#
# Voraussetzung: Dienste laufen lokal auf dem Server:
#   - Port 8080  → Tom's Mal App / OpenClaw Webchat
#   - Port 8765  → Festung / PyMuPDF-Tools

server {
    listen 443 ssl http2;
    server_name app.mapaluto.de;

    # SSL-Zertifikate (Let's Encrypt oder Cloudflare Origin)
    # ssl_certificate     /etc/letsencrypt/live/app.mapaluto.de/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.mapaluto.de/privkey.pem;

    # Root ohne Backend → Cloudflare 502. Entweder Redirect oder Mini-Startseite:
    location = / {
        default_type text/html;
        return 200 '<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>app.mapaluto.de</title></head><body><h1>app.mapaluto.de</h1><ul><li><a href="/toms-mal-app/">Tom\'s Mal App</a></li><li><a href="/festung/">Festung / PDF</a></li><li><a href="https://mapaluto.de/">mapaluto.de Portal</a></li></ul></body></html>';
    }

    # Cloudflare Access / Tunnel kann davor sitzen – Proxy-Header setzen
    location /toms-mal-app/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /festung/ {
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
