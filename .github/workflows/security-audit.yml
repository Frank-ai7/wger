name: Security Audit

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 6 * * 1'  # every Monday 06:00 UTC (catches new CVEs without push)
  workflow_dispatch:      # manual trigger via GitHub UI → Actions → "Run workflow"

permissions:
  contents: read

jobs:
  secrets:
    name: Gitleaks — Secret Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history required to catch secrets in old commits

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-deps:
    name: pip-audit — Python CVEs
    runs-on: ubuntu-latest
    continue-on-error: true  # informational: reports pre-existing CVEs without blocking
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Audit Python dependencies
        run: uv run --with pip-audit pip-audit

  js-deps:
    name: yarn audit — JS CVEs
    runs-on: ubuntu-latest
    continue-on-error: true  # informational: reports pre-existing CVEs without blocking
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JS dependencies
        run: COREPACK_ENABLE_STRICT=0 YARN_IGNORE_PATH=1 yarn install
        continue-on-error: true

      - name: Audit JS dependencies
        run: COREPACK_ENABLE_STRICT=0 YARN_IGNORE_PATH=1 yarn npm audit --all

  sast:
    name: Semgrep — Static Analysis
    runs-on: ubuntu-latest
    continue-on-error: true  # informational: reports pre-existing findings without blocking
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5

      - name: Run Semgrep (Django + Python rules)
        run: semgrep --config=p/django --config=p/python --config=p/secrets .

  bandit:
    name: Bandit — Python Security Review
    runs-on: ubuntu-latest
    continue-on-error: true  # informational: reports pre-existing findings without blocking
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Bandit (medium severity and above)
        run: uv run --with bandit bandit -r wger/ -ll -f json -o bandit-report.json || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

  vorcheck:
    name: Vorcheck — Vollständiger Repo-Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Secrets in Dateien suchen
        run: |
          echo "=== Hardcoded Secrets ===" 
          grep -rn "password\|api_key\|token\|private_key" \
            --include="*.py" --include="*.js" --include="*.yml" . \
            | grep -iE "=\s*['\"][a-zA-Z0-9+/]{16,}" \
            | grep -iv "example\|dummy\|test\|placeholder\|your_" \
            || echo "Keine gefunden"

      - name: Gefährliche Code-Muster suchen
        run: |
          echo "=== Dangerous Patterns ==="
          grep -rn "eval(\|exec(\|pickle.loads\|os.system\|__import__" \
            --include="*.py" . | grep -v "test\|#" || echo "Keine gefunden"

      - name: Netzwerk-Exfiltration prüfen
        run: |
          echo "=== Network Calls ==="
          grep -rn "requests.post\|urllib.*post" \
            --include="*.py" . | grep -v "test\|#" | head -20 || echo "Keine gefunden"

      - name: Bandit Vollscan
        run: uv run --with bandit bandit -r wger/ -ll -f json -o vorcheck-report.json || true

      - name: Vorcheck-Report speichern
        uses: actions/upload-artifact@v4
        with:
          name: vorcheck-report
          path: vorcheck-report.json
          retention-days: 90
